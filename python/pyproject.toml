[project]
name = "simulado-cla-omr"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.121.0",
  "uvicorn==0.38.0",
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "pillow==12.0.0",
  "python-dotenv==1.2.1",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "httpx==0.28.1"]

[tool.setuptools]
packages = ["omr"]
py-modules = ["main"]

[tool.pytest.ini_options]
pythonpath = ["."]
